name: Docs

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libegl1
      - name: Install dependencies
        run: uv sync --extra docs --frozen
      - name: Build Chinese documentation
        run: uv run --frozen --no-sync sphinx-build -b html -D language=zh docs/source docs/build/html/zh
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/build/html

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
