name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      # 静态检查不需要安装当前项目，避免触发本地构建和运行时依赖安装。
      - run: uv sync --group dev --frozen --no-install-project
      - run: uv run --frozen --no-sync ruff check .
      - run: uv run --frozen --no-sync ruff format --check .
      - run: uv run --frozen --no-sync pyright

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # 星历内核（kernels/*.bsp）经 Git LFS 入库，测试需真实二进制
          lfs: true
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install system dependencies
        # runner 镜像通常已预装 libEGL，先探测，缺失才走 apt；apt 加超时与
        # 重试，防止镜像源卡住时 apt-get update 无限挂起（曾致 CI 卡 10+ 分钟）
        run: |
          if ldconfig -p | grep -q 'libEGL\.so\.1'; then
            echo "libEGL 已预装，跳过 apt"
          else
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
            sudo apt-get install -y --no-install-recommends libegl1
          fi
      - run: uv sync --extra test --frozen
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run --frozen --no-sync pytest tests/ -v -m "not spice"
