name: Release

on:
  push:
    tags:
      - "v*"
  # 分支手动触发用于演练构建（校验与发布步骤仅在 tag ref 下执行）
  # Branch dispatch rehearses the builds; validation and publishing run only on tag refs.
  workflow_dispatch:

# AI 会话运行时（omp ACP）固定版本：升级时改此处并跑
# scripts/smoke_omp_acp.py 回归（协议行为以本机握手实测为准）
env:
  OMP_VERSION: v18.1.11

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: 校验发布元数据
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 校验 Tag 与版本
        if: startsWith(github.ref, 'refs/tags/v')
        run: bash packaging/scripts/validate-release.sh

  lint:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --group dev --frozen --no-install-project
      - run: uv run --frozen --no-sync ruff check .
      - run: uv run --frozen --no-sync ruff format --check .

  # lint 与 test 并行跑（此前串行链多花约 45 秒）；构建作业仍同时以两者为闸
  # lint and test run in parallel (the serial chain cost ~45s); builds still gate on both.
  test:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # 星历内核（kernels/*.bsp）经 Git LFS 入库，需拉取真实二进制
          lfs: true
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install system dependencies
        run: |
          if ldconfig -p | grep -q 'libEGL\.so\.1'; then
            echo "libEGL 已预装，跳过 apt"
          else
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
            sudo apt-get install -y --no-install-recommends libegl1
          fi
      - run: uv sync --extra test --frozen
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run --frozen --no-sync pytest tests/ -v -m "not spice"

  build-windows:
    needs: [validate, lint, test]
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # CHANGELOG 截取只读工作区文件，构建链不依赖 git 历史
          # Release notes reads the worktree only; the build chain needs no git history.
          fetch-depth: 1
          persist-credentials: false
          # 星历内核（kernels/*.bsp）经 Git LFS 入库，需拉取真实二进制
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: npm ci --prefix frontend
      - run: npm --prefix frontend run build
      - run: uv sync --group build --frozen
      - name: Build sidecar (PyInstaller onefile)
        run: uv run --no-sync pyinstaller packaging/transfer_orbit_design_sidecar.spec --noconfirm
      # 打包冒烟闸：design_orbit 真调用走完整星历链（R2S2 包内 lte440 打开、
      # SPICE 内核加载、修正收敛），漏带依赖/数据的坏包在此变红，不进安装包
      - name: Smoke sidecar (design_orbit real call)
        run: uv run --no-sync python scripts/smoke_mcp_serve.py --exe dist/transfer-orbit-design-sidecar.exe --cwd . --kernels kernels
      - name: Stage sidecar into tauri resources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries
          Copy-Item dist/transfer-orbit-design-sidecar.exe src-tauri/binaries/transfer-orbit-design-sidecar.exe
      # AI 会话运行时 omp 固定版本随包分发（dev 走 TOD_OMP_BIN/PATH；
      # 分发解析资源目录 binaries/omp.exe，不依赖用户预装）
      - name: Stage pinned omp into tauri resources
        shell: pwsh
        run: |
          curl -fsSL "https://github.com/can1357/oh-my-pi/releases/download/${{ env.OMP_VERSION }}/omp-windows-x64.exe" -o src-tauri/binaries/omp.exe
          if ((Get-Item src-tauri/binaries/omp.exe).Length -lt 10MB) { throw "omp 下载不完整" }
      # 增量更新第一步：瘦身包（不含 kernels/ 星历，约省 170MB）——应用内更新
      # 通道专用。装机端 kernels/ 已存在且 NSIS 覆盖安装不动既有文件，星历不
      # 随每次更新重下；全量包仅供新装用户，仍含完整星历
      - name: Build slim NSIS installer (updater channel)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm --prefix frontend exec -- tauri build --config packaging/tauri.release.slim.conf.json --bundles nsis
      - name: Assert slim NSIS updater signature exists
        shell: pwsh
        run: |
          if (-not (Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe.sig -ErrorAction SilentlyContinue)) {
            throw "瘦身 NSIS 安装包没有 .sig：TAURI_SIGNING_PRIVATE_KEY 未生效"
          }
      # 重命名为 *-setup-slim.* 并移出 bundle 目录，避免与随后的全量包同名互覆
      - name: Stage slim artifacts with -slim suffix
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/bundle-slim | Out-Null
          Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe, `
                        src-tauri/target/release/bundle/nsis/*-setup.exe.sig | ForEach-Object {
            $newName = $_.Name -replace '-setup(\.exe)(\.sig)?$', '-setup-slim$1$2'
            Move-Item $_.FullName (Join-Path src-tauri/bundle-slim $newName)
          }
          Get-ChildItem src-tauri/bundle-slim
      # 全量 NSIS 走应用内更新通道；MSI 仅供偏好该格式的新装用户手装
      # （企业管理部署等），不进 latest.json
      - name: Build NSIS installer and MSI
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm --prefix frontend exec -- tauri build --config packaging/tauri.release.conf.json --bundles nsis,msi
      # 签名闸：TAURI_SIGNING_PRIVATE_KEY 未生效时 tauri build 静默跳过签名，
      # 坏包带空签名混进 Release → 应用内更新验签必败（4.6.0/4.6.1 实际缺陷），
      # 在此拦截而不是等收尾作业或用户更新时才炸
      - name: Assert NSIS updater signature exists
        shell: pwsh
        run: |
          if (-not (Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe.sig -ErrorAction SilentlyContinue)) {
            throw "NSIS 安装包没有 .sig：TAURI_SIGNING_PRIVATE_KEY 未生效，检查仓库 Secrets 与密钥对配置"
          }
      - name: Extract release notes from CHANGELOG
        shell: bash
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash packaging/scripts/extract-release-notes.sh release_notes.md
      # 直传 Release，不经 actions artifact 中转（artifact 存储配额有限，
      # 历史上 300MB 级安装包很快打满；Release 资产不计入该配额）
      # 仅 tag 触发时发布；分支 dispatch 演练止步于构建与冒烟
      # Publish only on tag pushes; branch dispatch rehearsals stop at build+smoke.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release_notes.md
          files: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/bundle-slim/*-setup-slim.exe
            src-tauri/bundle-slim/*-setup-slim.exe.sig
          generate_release_notes: true

  build-linux:
    needs: [validate, lint, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          # GitHub 免费臂：arm64 由原生 arm runner 构建（PyInstaller 不支持
          # 交叉编译，sidecar 必须在目标架构上现场打包）
          - arch: amd64
            runs-on: ubuntu-22.04
          - arch: aarch64
            runs-on: ubuntu-22.04-arm
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # 同 build-windows：无 git 历史依赖
          # Same as build-windows: no git-history dependency.
          fetch-depth: 1
          persist-credentials: false
          # 星历内核（kernels/*.bsp）经 Git LFS 入库，需拉取真实二进制
          lfs: true
      - name: Install system dependencies for Tauri and WebKitGTK
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libegl1 \
            patchelf \
            rpm \
            cmake \
            xdg-utils
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}
          workspaces: src-tauri
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: npm ci --prefix frontend
      - run: npm --prefix frontend run build
      # calcephpy 在非 Windows 平台回落 sdist 现场编译，cmake 已在上方显式安装
      - run: uv sync --group build --frozen
      - name: Build sidecar (PyInstaller onefile)
        run: uv run --no-sync pyinstaller packaging/transfer_orbit_design_sidecar.spec --noconfirm
      # 打包冒烟闸：同 Windows 作业，design_orbit 真调用守卫坏包
      - name: Smoke sidecar (design_orbit real call)
        run: uv run --no-sync python scripts/smoke_mcp_serve.py --exe dist/transfer-orbit-design-sidecar --cwd . --kernels kernels
      - name: Stage sidecar into tauri resources
        run: |
          mkdir -p src-tauri/binaries
          cp dist/transfer-orbit-design-sidecar src-tauri/binaries/transfer-orbit-design-sidecar
          chmod +x src-tauri/binaries/transfer-orbit-design-sidecar
      # AI 会话运行时 omp 固定版本随包分发（同 Windows 作业）
      - name: Stage pinned omp into tauri resources
        run: |
          curl -fsSL "https://github.com/can1357/oh-my-pi/releases/download/${{ env.OMP_VERSION }}/omp-linux-x64" -o src-tauri/binaries/omp
          chmod +x src-tauri/binaries/omp
          [ "$(stat -c%s src-tauri/binaries/omp)" -gt 10000000 ] || { echo "omp 下载不完整"; exit 1; }
          src-tauri/binaries/omp --version
      # 增量更新第一步：瘦身 AppImage（不含 kernels/），同 Windows 作业
      - name: Build slim AppImage (updater channel)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npm --prefix frontend exec -- tauri build --config packaging/tauri.release.slim.conf.json --bundles appimage
      - name: Assert slim AppImage signature exists
        run: |
          ls src-tauri/target/release/bundle/appimage/*.AppImage.sig > /dev/null
      - name: Stage slim artifacts with -slim suffix
        run: |
          mkdir -p src-tauri/bundle-slim
          cd src-tauri/target/release/bundle/appimage
          for f in *.AppImage; do
            mv "$f" "../../../../bundle-slim/${f%.AppImage}-slim.AppImage"
          done
          for f in *.AppImage.sig; do
            mv "$f" "../../../../bundle-slim/${f%.AppImage.sig}-slim.AppImage.sig"
          done
          ls -la ../../../../bundle-slim
      - name: Build AppImage, DEB and RPM bundles
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npm --prefix frontend exec -- tauri build --config packaging/tauri.release.conf.json --bundles appimage,deb,rpm
      # 签名闸：同 Windows 作业
      - name: Assert Linux updater signatures exist
        run: |
          ls src-tauri/target/release/bundle/appimage/*.AppImage.sig \
             src-tauri/target/release/bundle/deb/*.deb.sig \
             src-tauri/target/release/bundle/rpm/*.rpm.sig > /dev/null
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/deb/*.deb.sig
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/rpm/*.rpm.sig
            src-tauri/bundle-slim/*-slim.AppImage
            src-tauri/bundle-slim/*-slim.AppImage.sig

  # 收尾：汇总各平台直传的资产，核对产物齐全，生成 checksums.txt 与更新元
  # 清单 latest.json（增量更新通道 → 各平台瘦身包）并回传 Release。
  # 仅 tag 触发；分支 dispatch 演练无发布产物可汇总
  # Tag-triggered only: branch dispatch rehearsals have no published assets to collect.
  release:
    name: 生成 checksums 与更新元清单
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Extract release notes from CHANGELOG
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash packaging/scripts/extract-release-notes.sh release_notes.md
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p release-assets
          gh release download "$TAG_NAME" --dir release-assets --repo "${{ github.repository }}"

      - name: 校验发布产物
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          mapfile -t slim_exes < <(find release-assets -type f -name '*-setup-slim.exe' | sort)
          mapfile -t exes < <(find release-assets -type f -name '*-setup.exe' | sort)
          mapfile -t msis < <(find release-assets -type f -name '*.msi' | sort)
          mapfile -t slim_appimages < <(find release-assets -type f -name '*-slim.AppImage' | sort)
          mapfile -t appimages < <(find release-assets -type f -name '*.AppImage' ! -name '*-slim.AppImage' | sort)
          mapfile -t debs < <(find release-assets -type f -name '*.deb' | sort)
          mapfile -t rpms < <(find release-assets -type f -name '*.rpm' | sort)
          if [[ "${#slim_exes[@]}" -ne 1 || "${#exes[@]}" -ne 1 || "${#msis[@]}" -ne 1 \
             || "${#slim_appimages[@]}" -ne 2 || "${#appimages[@]}" -ne 2 \
             || "${#debs[@]}" -ne 2 || "${#rpms[@]}" -ne 2 ]]; then
            echo "错误：预期各 1 份瘦身/全量 exe、1 份 msi（Windows 仅 x64），各 2 份瘦身/全量 AppImage、deb、rpm（Linux amd64+aarch64），实际为 ${#slim_exes[@]} 瘦身 exe、${#exes[@]} 全量 exe、${#msis[@]} msi、${#slim_appimages[@]} 瘦身 AppImage、${#appimages[@]} 全量 AppImage、${#debs[@]} deb、${#rpms[@]} rpm" >&2
            find release-assets -type f | sort >&2
            exit 1
          fi
          printf '发布产物（%s）：\n%s\n' "${TAG_NAME}" "$(find release-assets -type f | sort)"

      - name: Generate checksums
        run: |
          cd release-assets
          find . -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) -print0 | sort -z | xargs -0 sha256sum > ../checksums.txt
          cd ..
          cat checksums.txt

      - name: 合并各平台 Updater 签名并生成 latest.json
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          bash packaging/scripts/merge-updater-json.sh release-assets release-assets/latest.json "${VERSION}" release_notes.md

      - name: Upload latest.json and checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release upload "$TAG_NAME" release-assets/latest.json checksums.txt --clobber --repo "${{ github.repository }}"
